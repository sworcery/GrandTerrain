name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Full Gradle builds are skipped in CI: Minecraft artifact downloads from
  # Mojang/Fabric are slow and unreliable on runners; the mod is built and
  # smoke-tested locally before pushes.
  web:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web

  worker:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install worker dependencies
        run: pip install -r worker/requirements.txt -r worker/requirements-dev.txt
      - name: Run worker tests
        run: python -m pytest worker/tests -q

  # Compiles the MC-free worldgen code + evaluation tools without Gradle or
  # any Minecraft download — catches noise/cave/river compile breakage fast.
  worldgen-tools:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      # ConfigSnapshot now carries a DFU codec (world settings are persisted into
      # level.dat), so the MC-free worldgen tree needs DataFixerUpper + its two
      # runtime deps on the classpath. Fetched from Mojang's maven; no MC download.
      - name: Fetch DataFixerUpper (+gson, fastutil)
        run: |
          mkdir -p /tmp/gt-libs
          curl -sSfL -o /tmp/gt-libs/dfu.jar https://libraries.minecraft.net/com/mojang/datafixerupper/9.0.19/datafixerupper-9.0.19.jar
          curl -sSfL -o /tmp/gt-libs/gson.jar https://repo1.maven.org/maven2/com/google/code/gson/gson/2.9.0/gson-2.9.0.jar
          curl -sSfL -o /tmp/gt-libs/fastutil.jar https://repo1.maven.org/maven2/it/unimi/dsi/fastutil/8.5.18/fastutil-8.5.18.jar
      - run: javac -cp "/tmp/gt-libs/*" -sourcepath mod/src/main/java -d /tmp/gt-tools mod/tools/*.java
      - run: java -cp "/tmp/gt-libs/*:/tmp/gt-tools" RangeProbe
      # Proves world settings round-trip through the codec — the pregen-boundary
      # seam bug regression gate.
      - run: java -cp "/tmp/gt-libs/*:/tmp/gt-tools" SettingsRoundTrip

  datapack-json:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all mod JSON resources
        run: |
          python - <<'EOF'
          import json, pathlib, sys
          bad = []
          for p in pathlib.Path("mod/src/main/resources").rglob("*.json"):
              try:
                  json.loads(p.read_text())
              except ValueError as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("all JSON valid")
          EOF
