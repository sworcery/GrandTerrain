# NOTE: keep the env block in sync with the root docker-compose.yml (the
# full web+worker stack) — same variables, same defaults.
services:
  worker:
    build: .
    ports:
      - "${WORKER_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    environment:
      - MOD_JAR_PATH=/app/data/grandterrain.jar
      - FABRIC_API_JAR_PATH=/app/data/fabric-api.jar
      - SERVER_JAR_PATH=/app/data/fabric-server-launch.jar
      - SERVER_STARTUP_TIMEOUT=180
      - GENERATION_SETTLE_TIME=30
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-1}
      - JOB_RETENTION_HOURS=${JOB_RETENTION_HOURS:-24}
      - MIN_FREE_DISK_GB=${MIN_FREE_DISK_GB:-5}
      - CHUNKY_JAR_PATH=/app/data/chunky.jar
      - SERVER_MEMORY=${SERVER_MEMORY:-6G}
      - PREGEN_RADIUS=${PREGEN_RADIUS:-2000}
      - PREGEN_TIMEOUT=${PREGEN_TIMEOUT:-21600}
      - MIN_FREE_DISK_GB=${MIN_FREE_DISK_GB:-5}
    healthcheck:
      # /health reports "degraded" (still HTTP 200) when jars are missing;
      # the check only asserts the API is up. start_period is generous
      # because first boot downloads ~100 MB of jars before uvicorn starts.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    restart: unless-stopped
